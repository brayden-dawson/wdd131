<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Playground</title>
</head>
<body>
    <form>
        <label for="ssn">Enter your social security number:</label>
        <input type="text" id="ssn" placeholder="111-11-1111" name="ssn" required maxlength="9" minlength="9">
        <input type="search" id="search" name="search" required>
        <input type="password" name="password" required>
        <input type="tel" name="telephone" required>
        <input type="color" name="color" required>
        <input type="file" name="file" required>
        <input type="submit" value="submit" required>

    </form>
</body>
</html>
